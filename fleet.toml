# WAMP fleet manifest - the ONE versioned answer to "which repositories are aligned, and how far".
#
# Every repository listed here shares the same contribution workflow via two git submodules:
#   .ai   -> wamp-proto/wamp-ai    (AI policy, commit hooks, audit-file generator)
#   .cicd -> wamp-proto/wamp-cicd  (shared CI actions, workflow.just, community-file templates)
# A rollout pins EVERY repository of a wave to the same .ai and .cicd commits.
#
# Read by wamp-fleet-rollout.sh (Python stdlib `tomllib`, no extra dependency).
#
# Fields:
#   name            local checkout directory under ~/work/wamp/
#   slug            GitHub owner/repo (the canonical, "upstream" repository)
#   default_branch  integration branch (WORKFLOW_MAIN for workflow.just)
#   kind            python | javascript | spec | tool | site | cpp | java | tooling-source
#   wave            1 = current rollout, 2 = next, 0 = deliberately out of scope
#   notes           why this repository is where it is
#
# Verified against GitHub on 2026-09-29.

schema = 1

