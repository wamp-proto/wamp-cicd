#
# https://github.com/wamp-proto/wamp-cicd: /workflows/check-aspect.yml (#88)
#
# Run the caller's declared aspects' checks - `just check-aspect` - in CI, from the caller's
# own pins. A caller is a short file pinned to the commit of wamp-cicd it already pins:
#
#     jobs:
#       aspects:
#         uses: wamp-proto/wamp-cicd/.github/workflows/check-aspect.yml@<its wamp-cicd pin>
#
# This workflow knows no repository, aspect or host: everything comes at runtime from the
# caller's own aspects.toml, deps.toml and .gitmodules. A provider this CI cannot fetch (a
# private one, without a credential) is one generic line, `<aspect>: not checked here - its
# provider could not be fetched`, and is checked where the credentials are (ASPECTS_UNFETCHED,
# scripts/aspects.py). The fetch steps print nothing, because their messages would name the
# providers. Read-only token, no secrets.

name: check-aspect

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-aspect:
    name: just check-aspect
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Every submodule, one at a time, past any that cannot be fetched.
      - name: Submodules, as far as they can be fetched
        run: |
          set -uo pipefail
          [ -f .gitmodules ] || exit 0
          git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | while read -r _ path; do
            git submodule update --init -- "${path}" >/dev/null 2>&1 || true
          done

      # deps.toml entries, into .deps/, by the repository's own scripts/deps.sh (a managed,
      # byte-identical copy in every pinned repository); it continues past any it cannot get.
      - name: Dependencies (deps.toml), as far as they can be fetched
        run: |
          set -uo pipefail
          [ -f deps.toml ] && [ -f scripts/deps.sh ] || exit 0
          bash scripts/deps.sh sync >/dev/null 2>&1 || true

      - name: Install just 1.42.4
        env:
          JUST_VERSION: "1.42.4"
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p "$HOME/bin" && tar -xzf /tmp/just.tar.gz -C "$HOME/bin" just
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/just" --version

      - name: just check-aspect
        env:
          ASPECTS_UNFETCHED: warn
        run: just check-aspect
