#
# Run this repository's own tests (`just test`) on every pull request and on main (#58).
# Until now nothing here ran them in CI: the workflow recipes, the community files, the
# inventory and the fleet tooling (incl. the end-to-end rollout sandbox) were only tested
# locally.
#
# Test-only: read-only token, no secrets, nothing published. Actions and tools are pinned to
# exact versions (#56).

name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: just test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The tests run the REAL wamp-ai justfile and commit-msg hook. wamp-ai comes the way every
      # dependency of this repository does: at the commit deps.toml pins, into .deps/ (#69).
      - name: Dependencies at their pinned commits (deps.toml)
        run: bash scripts/deps.sh sync

      - name: Install just 1.42.4
        env:
          JUST_VERSION: "1.42.4"
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL -o /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p "$HOME/bin" && tar -xzf /tmp/just.tar.gz -C "$HOME/bin" just
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/just" --version

      - name: just test
        env:
          AI_JUSTFILE: ${{ github.workspace }}/.deps/wamp-ai/justfile
        run: just test
